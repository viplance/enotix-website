<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thank you — Enotix</title>
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="stylesheet" href="../index.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&amp;display=swap"
      rel="stylesheet"
    />
    <style>
      body.result-page {
        min-height: 100vh;
        height: auto;
        width: 100%;
        display: grid;
        place-items: center;
        overflow-x: hidden;
        color: #ddd;
      }

      .result-shell {
        position: relative;
        z-index: 1;
        width: min(100% - 40px, 480px);
        text-align: center;
        padding: 48px 0 80px;
        animation: fadeIn 0.8s ease-out;
      }

      .result-icon {
        font-size: 48px;
        margin-bottom: 20px;
      }

      .result-title {
        color: #fff;
        font-size: clamp(28px, 5vw, 40px);
        line-height: 1.1;
        letter-spacing: -0.03em;
        margin-bottom: 14px;
      }

      .result-text {
        color: rgba(255, 255, 255, 0.55);
        font-size: 16px;
        line-height: 1.6;
        margin-bottom: 32px;
      }

      .result-status {
        color: rgba(255, 255, 255, 0.4);
        font-size: 14px;
        margin-bottom: 24px;
      }

      .result-status.confirmed {
        color: rgba(130, 255, 160, 0.8);
      }

      .result-link {
        display: inline-block;
        padding: 12px 28px;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 10px;
        color: #fff;
        text-decoration: none;
        font-size: 15px;
        font-weight: 700;
        transition: background 0.2s;
      }

      .result-link:hover {
        background: rgba(255, 255, 255, 0.12);
      }

      .donate-brand {
        display: inline-flex;
        margin-bottom: 32px;
      }

      .donate-brand img {
        width: 54px;
        height: 54px;
        object-fit: contain;
        filter: drop-shadow(0 0 14px rgba(255, 255, 255, 0.12));
      }
    </style>
  </head>
  <body class="result-page">
    <div class="result-shell">
      <a href="/" class="donate-brand">
        <img src="../enotix-logo.svg" alt="Enotix" />
      </a>

      <div class="result-icon">&#10003;</div>
      <h1 class="result-title">Thank you!</h1>
      <p class="result-text">
        Your donation is being processed. We truly appreciate your support.
      </p>
      <p class="result-status" id="payment-status">Confirming payment...</p>

      <a href="/" class="result-link">Back to Enotix</a>
    </div>

    <footer class="site-footer">
      <a href="../products.html">Products</a>
      <a href="../privacy.html">Privacy</a>
    </footer>

    <script>
      const API_BASE = "https://us-central1-enotix.cloudfunctions.net/enotix-donate";

      const statusEl = document.getElementById("payment-status");

      const params = new URLSearchParams(window.location.search);
      const donationId = params.get("id");

      if (donationId) {
        let attempts = 0;
        const maxAttempts = 30;

        async function checkStatus() {
          try {
            const res = await fetch(
              `${API_BASE}/api/donations/status?id=${encodeURIComponent(donationId)}`
            );
            if (!res.ok) throw new Error("Failed to check status");
            const data = await res.json();

            if (data.status === "paid") {
              statusEl.textContent = "Payment confirmed. Thank you for your support!";
              statusEl.classList.add("confirmed");
              return;
            }
          } catch (e) {
            // Silently retry
          }

          attempts++;
          if (attempts < maxAttempts) {
            setTimeout(checkStatus, 2000);
          } else {
            statusEl.textContent =
              "Payment is still being processed. It may take a few minutes.";
          }
        }

        checkStatus();
      } else {
        statusEl.textContent = "";
      }
    </script>
  </body>
</html>
